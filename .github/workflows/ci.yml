name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Nudge.sln --nologo

      - name: Test
        run: dotnet test test/Nudge.Tests/Nudge.Tests.csproj --no-build --nologo

      - name: Smoke-test skill install
        run: dotnet run --no-build --project src/Nudge/Nudge.csproj -- skill install --dry-run
